# ===== Application Info =====
spring.application.name=carshare-backend

# ===== MySQL Database Connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/carshare_db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Import secrets file (not committed to Git) =====
spring.config.import=optional:classpath:application-secrets.properties

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# ===== Business Rules =====
app.platform-commission-rate=0.10
# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
# ===== Logging =====
logging.file.name=logs/carshare.log
logging.level.root=INFO
logging.level.com.carshare=INFO
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7